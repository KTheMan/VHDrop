[package]
name = "vhdrop"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"

[dependencies]
raw-window-handle = "0.6"
eframe = { version = "0.34.1", default-features = false, features = ["accesskit", "glow", "default_fonts", "x11"] }
ouroboros-ui = { git = "https://github.com/Type-zero-labs/ouroboros-ui", rev = "c390d7deffa7955e28b2e3bcb9c22ac0899a261b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
egui-phosphor = { version = "0.12", default-features = false, features = ["light", "regular"] }
base64 = "0.22"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[build-dependencies]
embed-resource = "3"

